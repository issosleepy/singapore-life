button {
    border: 0;

    background: #263449;
    color: white;

.blue {

}

.gold {
    background: #a16207 !important;
}

.danger {

}

#app {
    max-width: 1250px;
    margin: auto;
    padding: 18px;
}

header {
    background: linear-gradient(135deg, #c51f2b, #7f1d1d);
    padding: 22px;
    border-radius: 18px;
    margin-bottom: 14px;
}

header h1 {
    margin: 0;
}

header p {
    margin-bottom: 0;
    color: #fee2e2;
}

.stats {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.stat {
    background: #172235;
    border-radius: 10px;
    padding: 9px;
    text-align: center;
}

.stat b {
    display: block;
    font-size: 17px;
    margin-top: 4px;
}

.layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 14px;
}

nav,
main {
    background: #111b2c;
    border-radius: 16px;
    padding: 14px;
}

nav {
    height: max-content;
}

nav button {
    width: 100%;
    text-align: left;
    background: transparent;
    margin: 2px 0;
}

main {
    min-height: 650px;
}

.hero {
    background: linear-gradient(135deg, #1e293b, #172554);
    padding: 17px;
    border-radius: 14px;
    margin-bottom: 12px;
}

.hero h2 {
    margin-top: 0;
}

.card {
    background: #172235;
    border-radius: 13px;
    padding: 14px;
    margin: 9px 0;
}

.choice {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 7px;
}

.choice button {
    text-align: left;
    min-height: 65px;
}

.small {
    font-size: 12px;
    color: #aab5c5;
}

.money {
    color: #86efac;
}

.success {
    background: #052e16;
    border: 1px solid #166534;
    padding: 12px;
    border-radius: 11px;
}

.warning {
    background: #422006;
    border: 1px solid #92400e;
    padding: 12px;
    border-radius: 11px;
}

.log {
    max-height: 430px;
    overflow-y: auto;
}

.log div {
    padding: 8px 0;
    border-bottom: 1px solid #ffffff12;
}

hr {
    border: 0;
    border-top: 1px solid #ffffff12;
    margin: 10px 0;
}

.badge {
    display: inline-block;
    background: #263449;
    padding: 4px 8px;
    border-radius: 20px;
    margin: 2px;
    font-size: 12px;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 15px;
}

@media(max-width:900px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: repeat(4, 1fr);
    }

    nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:550px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>

/* =========================================================
   HELPERS
========================================================= */

let game = null;

function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
}

function money(n) {
    return "$" + Math.round(n || 0).toLocaleString();
}

function chance(probability) {
    return Math.random() < Math.max(0, Math.min(1, probability));
}

function addLog(text) {

    game.logs.unshift(
        `<div>
            <span class="small">Age ${game.age}</span>
            — ${text}
        </div>`
    );

    game.logs = game.logs.slice(0, 150);
}

function saveGame() {

    if (!game) return;

    localStorage.setItem(
        "SG_LIFE_V15_1",
        JSON.stringify(game)
    );
}

function loadGame() {

    const saved = localStorage.getItem("SG_LIFE_V15_1");

    if (!saved) {
        alert("No saved game found.");
        return;
    }

    game = JSON.parse(saved);

    render();
}

function button(text, action, cls = "") {

    return `<button class="${cls}" onclick="${action}">
        ${text}
    </button>`;
}


/* =========================================================
   START
========================================================= */

function startGame() {

    game = clone(BASE_PLAYER);

    const r = Math.random();

    if (r < 0.20) {

        game.family = "Poor";
        game.parentsIncome = 2200;
        game.money = 300;

    } else if (r < 0.75) {

        game.family = "Middle Class";
        game.parentsIncome = 6500;
        game.money = 2500;

    } else if (r < 0.95) {

        game.family = "Upper Middle Class";
        game.parentsIncome = 15000;
        game.money = 25000;

    } else {

        game.family = "Rich";
        game.parentsIncome = 50000;
        game.money = 250000;
    }

    game.intelligence =
        Math.floor(Math.random() * 31) + 55;

    game.charisma =
        Math.floor(Math.random() * 31) + 50;

    game.discipline =
        Math.floor(Math.random() * 31) + 50;

    game.fitness =
        Math.floor(Math.random() * 31) + 50;

    addLog(
        `You were born into a <b>${game.family}</b> family.`
    );

    saveGame();

    render();
}

/* =========================================================
   EDUCATION FUNCTIONS
========================================================= */

function choosePrimary(index) {

    const school = PRIMARY_SCHOOLS[index];

    const score =
        game.intelligence * 0.75 +
        game.discipline * 0.25;

    const probability =
        0.18 +
        (score - school[1]) / 32;

    if (!chance(probability)) {

        addLog(
            `❌ ${school[0]} rejected you.`
        );

        educationPage();
        return;
    }

    game.school = school[0];
    game.schoolType = "primary";
    game.stage = "Primary School";

    addLog(
        `🏫 Accepted into <b>${school[0]}</b>.`
    );

    saveGame();

    educationPage();
}


function chooseSecondary(index) {

    const school = SECONDARY_SCHOOLS[index];

    const score =
        game.intelligence * 0.7 +
        game.discipline * 0.25 +
        game.ccaLevel * 3;

    const probability =
        0.15 +
        (score - school[1]) / 30;

    if (!chance(probability)) {

        addLog(
            `❌ ${school[0]} rejected you.`
        );

        educationPage();
        return;
    }

    game.school = school[0];
    game.schoolType = "secondary";
    game.stage = "Secondary School";

    addLog(
        `🏫 Accepted into <b>${school[0]}</b>.`
    );

    saveGame();

    educationPage();
}


function joinCCA(index) {

    const cca = CCAS[index];

    game.cca = cca[0];
    game.ccaLevel = 1;

    game[cca[1]] += 4;
    game[cca[2]] += 3;

    addLog(
        `🎯 Joined <b>${cca[0]}</b>.`
    );

    saveGame();

    educationPage();
}


function choosePostSecondary(index) {

    const school = POST_SECONDARY[index];

    const score =
        game.intelligence * 0.65 +
        game.discipline * 0.35;

    const probability =
        0.18 +
        (score - school[2]) / 38;

    if (!chance(probability)) {

        addLog(
            `❌ ${school[0]} rejected you.`
        );

        educationPage();
        return;
    }

    game.postSecondary = school[1];
    game.school = school[0];
    game.stage = school[1];

    addLog(
        `📚 Accepted into <b>${school[0]}</b>.`
    );

    saveGame();

    educationPage();
}


function applyUniversity(index) {

    const uni = UNIVERSITIES[index];

    if (
        uni[1] !== "Singapore" &&
        game.intelligence < 90
    ) {

        addLog(
            `❌ ${uni[0]} requires 90+ Intelligence.`
        );

        educationPage();
        return;
    }

    const score =
        game.intelligence * 0.55 +
        game.discipline * 0.20 +
        game.charisma * 0.10 +
        game.ccaLevel * 3;

    const probability =
        0.06 +
        (score - uni[2] + 10) / 100;

    if (!chance(probability)) {

        addLog(
            `❌ ${uni[0]} rejected your application.`
        );

        educationPage();
        return;
    }

    game.university = uni[0];
    game.universityCountry = uni[1];
    game.stage = "University";

    addLog(
        `🎓 Accepted to <b>${uni[0]}</b>.`
    );

    saveGame();

    educationPage();
}


function chooseCourse(index) {

    const course = COURSES[index];

    const degrees = {

        "Computer Science": "BSc Computer Science",
        "Business": "Bachelor of Business",
        "Finance": "BSc Finance",
        "Economics": "BSc Economics",
        "Law": "LLB Law",
        "Medicine": "MBBS Medicine",
        "Engineering": "BEng Engineering",
        "Political Science": "BA Political Science",
        "Communications": "BA Communications",
        "Media Studies": "BA Media Studies",
        "Psychology": "BA Psychology",
        "Biological Sciences": "BSc Biological Sciences",
        "Mathematics": "BSc Mathematics",
        "Architecture": "BArch Architecture"
    };

    game.course = course;

    game.degree = degrees[course];

    game.degrees.push(game.degree);

    addLog(
        `📚 Chose <b>${course}</b>.`
    );

    saveGame();

    educationPage();
}


function postgraduate(type) {

    if (
        type === "MBA" &&
        ![
            "Business",
            "Finance",
            "Economics"
        ].includes(game.course)
    ) {

        addLog(
            "❌ MBA requires Business, Finance or Economics."
        );

        educationPage();
        return;
    }


    if (
        type === "JD" &&
        game.course !== "Law"
    ) {

        addLog(
            "❌ JD requires Law."
        );

        educationPage();
        return;
    }


    if (
        type === "MD" &&
        ![
            "Medicine",
            "Biological Sciences"
        ].includes(game.course)
    ) {

        addLog(
            "❌ MD requires Medicine or Biological Sciences."
        );

        educationPage();
        return;
    }


    let degreeName;

    if (type === "Masters")
        degreeName = "Master's Degree";

    if (type === "MBA")
        degreeName = "MBA";

    if (type === "JD")
        degreeName = "Juris Doctor (JD)";

    if (type === "MD")
        degreeName = "Doctor of Medicine (MD)";

    if (type === "PhD")
        degreeName = "PhD";


    game.postgraduate.push(degreeName);

    addLog(
        `🎓 Completed <b>${degreeName}</b>.`
    );

    saveGame();

    educationPage();
}

function activityPage() {

    let type = "adult";

    else if (game.age < 13)
        type = "school";

    else if (game.age < 18)
        type = "teen";

    else if (game.age >= 65)

    const activities = ACTIVITIES[type];


    document.getElementById("main").innerHTML = `

        <div class="hero">

            <h2>
                🎯 Activities
            </h2>

                Do things during the year without ageing up.
            </p>

        </div>


        <div class="choice">

            ${
                activities.map(
                    (activity,index) => `

                        <button
                            onclick="doActivity('${type}',${index})"
                        >

                            <b>
                                ${activity[0]}
                            </b>

                            <br>

                            <span class="small">
                                +${activity[2]}
                                ${activity[1]}
                            </span>

                        </button>
                    `
                ).join("")
            }

        </div>


        <div class="card">

            <h3>
                🎯 CCA
            </h3>

            ${
                game.cca
                ? `
                    <b>${game.cca}</b>

                  `
                : "No CCA selected."
            }

        </div>
    `;
}


function doActivity(type,index) {

    const activity = ACTIVITIES[type][index];

    let cost = 0;

    if (activity[0].startsWith("✈️"))
        cost = 2000;

    if (activity[0].startsWith("🍜"))
        cost = 80;


    if (game.money < cost) {

        addLog(
            "❌ You cannot afford that activity."
        );

        activityPage();
        return;
    }


    game.money -= cost;


    if (activity[1] === "reputation") {

        game.reputation =
            Math.min(
                100,
                game.reputation + activity[2]
            );

    } else {

        game[activity[1]] =
            Math.min(
                100,
                game[activity[1]] + activity[2]
            );
    }


    addLog(
        `🎯 ${activity[0]}.`
    );

    saveGame();

    renderStats();

    activityPage();
}

function applyJob(index) {

    const job = JOBS[index];

    let score =
        game.intelligence * 0.40 +
        game.discipline * 0.20 +
        game.charisma * 0.20 +
        game.fitness * 0.05;


    if (game.degree)
        score += 12;

    score += game.postgraduate.length * 3;


    if (
        game.course === "Law" &&
        job[1] === "Law"
    )
        score += 15;


    if (
        game.course === "Medicine" &&
        job[1] === "Medicine"
    )
        score += 18;


    if (
        game.course === "Computer Science" &&
        job[1] === "Technology"
    )
        score += 15;


    if (
        game.course === "Media Studies" &&
        job[1] === "Media"
    )
        score += 15;


    if (!chance(
        0.07 +
        (score - job[4]) / 85
    )) {

        addLog(
            `❌ ${job[0]} rejected your application.`
        );

        careerPage();
        return;
    }


    game.company = job[0];
    game.career = job[1];
    game.role = job[3][0];

    game.careerLevel = 0;
    game.salary = job[2];
    game.yearsInJob = 0;

    game.stage = "Working";


    addLog(
        `💼 Hired by <b>${job[0]}</b>
        as ${game.role}.`
    );

    saveGame();

    careerPage();
}


function workYear() {

    if (!game.career)
        return;


    game.yearsInJob++;


    game.money += game.salary * 12;


    addLog(
        `💰 Annual salary paid:
        <b>${money(game.salary * 12)}</b>.`
    );


    if (
        game.yearsInJob >= 2 &&
        game.careerLevel < 4 &&
        chance(0.65) &&
        game.career !== "SAF"
    ) {

        game.careerLevel++;

        const job =
            JOBS.find(
                x => x[0] === game.company
            );


        if (job) {

            game.role =
                job[3][game.careerLevel];

            game.salary =
                Math.round(
                    game.salary * 1.20
                );
        }


        addLog(
            `📈 Promoted to
            <b>${game.role}</b>.`
        );
    }


    saveGame();

    careerPage();
}


function quitJob() {

    addLog(
        `🚪 You left ${game.company}.`
    );

    game.company = "";
    game.career = "";
    game.role = "";
    game.salary = 0;
    game.careerLevel = 0;
    game.yearsInJob = 0;

    saveGame();

    careerPage();
}

function buyCar(index) {

    const car = CARS[index];

    if (game.money < car[1]) {

        addLog(
            "❌ Not enough money for that car."
        );

        moneyPage();
        return;
    }


    game.money -= car[1];

    game.cars.push(car[0]);

    addLog(
        `🚗 Bought <b>${car[0]}</b>.`
    );

    saveGame();

    moneyPage();
}


function buyHouse(index) {

    const house = HOUSES[index];

    if (game.money < house[1]) {

        addLog(
            "❌ Not enough money for that property."
        );

        moneyPage();
        return;
    }


    game.money -= house[1];

    game.houses.push(house[0]);

    addLog(
        `🏠 Bought <b>${house[0]}</b>.`
    );

    saveGame();

    moneyPage();
}


function investMoney(amount) {

    if (game.money < amount) {

        addLog(
            "❌ Not enough money to invest."
        );

        moneyPage();
        return;
    }


    game.money -= amount;

    game.investments += amount;

    addLog(
        `📈 Invested ${money(amount)}.`
    );

    saveGame();

    moneyPage();
}


function liquidateInvestments() {

    if (!game.investments) {

        addLog(
            "❌ You have no investments."
        );

        moneyPage();
        return;
    }


    const result =
        Math.round(
            game.investments *
            (0.75 + Math.random() * 0.60)
        );


    game.money += result;

    game.investments = 0;


    addLog(
        `📈 Liquidated investments for
        <b>${money(result)}</b>.`
    );

    saveGame();

    moneyPage();
}

function tryAthlete(type) {

    if (game.age < 16) {

        addLog(
            "❌ Elite scouting starts at age 16."
        );

    let fitness =
        game.fitness;


    if (
        game.cca === "Football" &&
        type === "Premier League"
    ) {

        fitness += 15;
    }


    const probability =
        0.02 +
        (fitness - 65) / 105;


    if (!chance(probability)) {

        addLog(
            `❌ You were cut from the
            ${type} pathway.`
        );

        athletePage();

        return;
    }


    game.athlete = type;


    if (type === "NBA") {

        game.athleteClub =
            "NBA / G League pathway";

        game.athleteSalary =
            150000;

    } else {

        game.athleteClub =
            "Premier League Academy";

        game.athleteSalary =
            100000;
    }


    game.career =
        "Professional Athlete";

    game.company = type;

    game.role =
        game.athleteClub;

    game.salary =
        Math.round(
            game.athleteSalary / 12

    addLog(
        `🏆 Scouted into the
        <b>${type}</b> pathway!`
    );


    saveGame();

    athletePage();
}

function contestElection() {

    if (!game.politicalParty) {

        addLog(
            "❌ Choose a party or Independent first."
        );

        politicsPage();

        return;
    }


    const score =
        game.charisma * 0.35 +
        game.intelligence * 0.25 +
        game.discipline * 0.20 +
        game.reputation * 0.20;


    const probability =
        0.03 +
        (score - 45) / 100;


    if (!chance(probability)) {

        addLog(
            "🗳️ You lost the election."
        );

        game.reputation =
            Math.max(
                0,
                game.reputation - 3
            );

        politicsPage();

        return;
    }


    game.electionWins++;

    game.mp = true;

    game.career = "Politics";

    game.company =
        "Parliament of Singapore";

    game.role =
        "Member of Parliament";

    game.salary = 14000;

    game.reputation =

/* =========================================================
   AGE UP
========================================================= */

function ageUp() {

    if (!game) {

        alert(
            "Start a life first."
        );

        return;
    }


    if (!game.alive) {

        alert(
            "This life has ended."
        );

        return;
    }


    if (game.age >= 100) {

        game.alive = false;

        addLog(
            "⚰️ You died peacefully at age 100."
        );

        render();

        return;
    }


    game.age++;


    /* YEARLY SALARY */

    if (game.salary > 0) {

        const annualSalary =
            game.salary * 12;

        game.money += annualSalary;

        addLog(
            `💰 Annual salary paid:
            <b>${money(annualSalary)}</b>.`
        );
    }


    /* CAREER PROGRESSION */

    if (
        game.career &&
        game.salary > 0
    ) {

        game.yearsInJob++;


        if (
            game.yearsInJob >= 2 &&
            game.careerLevel < 4 &&
            chance(0.62) &&
            game.career !== "SAF" &&
            game.career !== "Politics"
        ) {

            game.careerLevel++;

            const job =
                JOBS.find(
                    x =>
                    x[0] === game.company
                );


            if (job) {

                game.role =
                    job[3][
                        game.careerLevel
                    ];

                game.salary =
                    Math.round(
                        game.salary * 1.20
                    );


                addLog(
                    `📈 Promoted to
                    <b>${game.role}</b>.`
                );
            }
        }
    }


    /* SAF PROGRESSION */

    if (game.safType) {

        game.safYears++;


        const ranks =
            SAF_RANKS[
                game.safType
            ];


        const current =
            ranks.indexOf(
                game.safRank
            );


        if (
            current < ranks.length - 1 &&
            chance(0.68)
        ) {

            game.safRank =
                ranks[current + 1];

            game.role =
                game.safRank;

            game.salary =
                Math.round(
                    game.salary * 1.16
                );


            addLog(
                `🪖 Promoted to
                <b>${game.safRank}</b>.`
            );
        }
    }


    /* NS */

    if (
        game.age === 18 &&
        !game.safType &&
        !game.nsCompleted
    ) {

        game.ns = true;

        addLog(
            "🪖 <b>National Service:</b>
            you are liable for NS."
        );
    }


    /* RESERVIST */

    if (
        game.age >= 20 &&
        game.age <= 40 &&
        game.age % 2 === 0 &&
        !game.safType
    ) {

        game.reservist = true;

        addLog(
            "🪖 <b>Reservist cycle:</b>
            mandatory training this year."
        );
    }


    /* HEALTH */

    if (game.age >= 40) {

        game.health -=
            Math.floor(
                Math.random() * 3
            );
    }


    if (game.age >= 60) {

        game.health -=
            Math.floor(
                Math.random() * 4
            );
    }


    /* RANDOM EVENTS */

    randomEvent();


    if (game.health <= 0) {

        game.alive = false;

        addLog(
            "⚰️ Your health failed."
        );
    }


    saveGame();

    render();
}


function randomEvent() {

    const r = Math.random();


    if (r < 0.06) {

        game.happiness =
            Math.min(
                100,
                game.happiness + 8
            );

        addLog(
            "🎉 You had an excellent year."
        );

    }


    else if (r < 0.11) {

        game.money =
            Math.max(
                0,
                game.money - 5000
            );

        addLog(
            "💸 Unexpected expenses cost you $5,000."
        );

    }


    else if (r < 0.16) {

        game.intelligence =
            Math.min(
                100,
                game.intelligence + 2
            );

        addLog(
            "📚 You gained useful knowledge."
        );

    }


    else if (r < 0.20) {

        game.health =
            Math.max(
                1,
                game.health - 5
            );

        addLog(
            "🤒 You had a difficult health year."
        );
    }
}
