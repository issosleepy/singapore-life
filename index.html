<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE AMERICAN DREAM - Life & Career Simulator</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-card: #181b21;
            --bg-card-hover: #22262f;
            --border-color: #2a2e39;
            --text-main: #f0f2f5;
            --text-muted: #8c93a0;
            --accent-red: #e63946;
            --accent-green: #2a9d8f;
            --accent-blue: #457b9d;
            --accent-gold: #e9c46a;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-stack);
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation Bar */
        header {
            background: #14171d;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }
        .logo { font-weight: 800; letter-spacing: 2px; font-size: 1.1rem; color: #fff; }
        .logo span { color: var(--accent-red); }
        .top-stats { display: flex; gap: 24px; font-size: 0.9rem; }
        .stat-badge { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-weight: 700; color: #fff; }

        /* Main Game Layout */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        nav {
            width: 220px;
            background: #14171d;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px 0;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 24px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-btn:hover { color: #fff; background: rgba(255,255,255,0.03); }
        .nav-btn.active { color: #fff; background: rgba(230, 57, 70, 0.12); border-left: 3px solid var(--accent-red); }

        /* Main Workspace */
        main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: var(--bg-dark);
        }

        /* Right Panel - Timeline Feed */
        aside {
            width: 320px;
            background: #14171d;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }
        .timeline-header { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .timeline-logs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        .log-entry { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; font-size: 0.85rem; }
        .log-age { font-weight: 700; color: var(--accent-red); margin-bottom: 2px; }

        /* Footer Control Bar */
        footer {
            background: #14171d;
            border-top: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }
        .btn-age {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.1s, background 0.2s;
        }
        .btn-age:hover { background: #d62839; transform: translateY(-1px); }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-secondary:hover { background: var(--bg-card-hover); }

        /* Card Component System */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .card-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
        .card-value { font-size: 1.5rem; font-weight: 800; color: #fff; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        /* Progress Bars */
        .meter { height: 8px; background: #262a34; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .meter-fill { height: 100%; background: var(--accent-green); transition: width 0.3s; }

        /* Tables */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .data-table th, .data-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
        .data-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: var(--bg-card); border: 1px solid var(--border-color); width: 90%; max-width: 580px; border-radius: 8px; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .modal-body { font-size: 0.95rem; color: #d0d4dc; margin-bottom: 20px; line-height: 1.6; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #222630; border: 1px solid var(--border-color); color: #fff; padding: 12px 16px; border-radius: 6px; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
        .option-btn:hover { background: #2d3240; border-color: var(--accent-blue); }

        /* Form elements for setup */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-input, .form-select { width: 100%; padding: 10px; background: #111318; border: 1px solid var(--border-color); border-radius: 4px; color: #fff; font-size: 0.9rem; }

        .hidden { display: none !important; }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }
        .text-gold { color: var(--accent-gold); }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header>
        <div class="logo">AMERICAN<span>DREAM</span></div>
        <div class="top-stats">
            <div class="stat-badge"><span class="stat-label">Name</span><span class="stat-value" id="top-name">---</span></div>
            <div class="stat-badge"><span class="stat-label">Age</span><span class="stat-value" id="top-age">0</span></div>
            <div class="stat-badge"><span class="stat-label">Location</span><span class="stat-value" id="top-location">---</span></div>
            <div class="stat-badge"><span class="stat-label">Occupation</span><span class="stat-value" id="top-occupation">Unemployed</span></div>
            <div class="stat-badge"><span class="stat-label">Cash</span><span class="stat-value text-green" id="top-cash">$0</span></div>
            <div class="stat-badge"><span class="stat-label">Net Worth</span><span class="stat-value text-gold" id="top-networth">$0</span></div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav>
            <button class="nav-btn active" onclick="switchTab('dashboard')"> Dashboard</button>
            <button class="nav-btn" onclick="switchTab('education')"> Education</button>
            <button class="nav-btn" onclick="switchTab('career')"> Career & Business</button>
            <button class="nav-btn" onclick="switchTab('finance')"> Investments</button>
            <button class="nav-btn" onclick="switchTab('realestate')"> Real Estate</button>
            <button class="nav-btn" onclick="switchTab('relationships')"> Family & Social</button>
            <button class="nav-btn" onclick="switchTab('relocate')"> Relocate</button>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Right Timeline Sidebar -->
        <aside>
            <div class="timeline-header">Life Timeline Log</div>
            <div class="timeline-logs" id="timeline-logs">
                <!-- Log items -->
            </div>
        </aside>
    </div>

    <!-- Bottom Controls -->
    <footer>
        <div>
            <button class="btn-secondary" onclick="saveGame()">Save Game</button>
            <button class="btn-secondary" onclick="loadGame()">Load Game</button>
            <button class="btn-secondary" onclick="resetGamePrompt()">New Life</button>
        </div>
        <button class="btn-age" onclick="advanceYear()">AGE +1</button>
    </footer>

    <!-- Universal Event Modal -->
    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-title" id="modal-title">Event Title</div>
            <div class="modal-body" id="modal-body">Event body description goes here.</div>
            <div class="modal-actions" id="modal-actions">
                <!-- Buttons injected dynamically -->
            </div>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // ==========================================
        // DATA STRUCTURES & CONFIGURATION
        // ==========================================
        const CITIES = {
            "New York, NY": { col: 1.8, tax: 0.08, jobBias: "Finance/Law" },
            "Los Angeles, CA": { col: 1.6, tax: 0.09, jobBias: "Entertainment/Tech" },
            "San Francisco, CA": { col: 2.0, tax: 0.09, jobBias: "Technology/VC" },
            "Boston, MA": { col: 1.5, tax: 0.05, jobBias: "Education/Biotech" },
            "Chicago, IL": { col: 1.2, tax: 0.06, jobBias: "Finance/Corporate" },
            "Austin, TX": { col: 1.1, tax: 0.00, jobBias: "Tech/Startups" },
            "Miami, FL": { col: 1.3, tax: 0.00, jobBias: "Real Estate/Finance" },
            "Houston, TX": { col: 0.9, tax: 0.00, jobBias: "Energy/Medicine" }
        };

        const UNIVERSITIES = [
            { name: "Harvard University", tier: "Elite", tuition: 55000, minGpa: 3.8, minSat: 1500 },
            { name: "Stanford University", tier: "Elite", tuition: 56000, minGpa: 3.8, minSat: 1510 },
            { name: "MIT", tier: "Elite", tuition: 55000, minGpa: 3.9, minSat: 1530 },
            { name: "UC Berkeley", tier: "Major Public", tuition: 28000, minGpa: 3.5, minSat: 1380 },
            { name: "UT Austin", tier: "Major Public", tuition: 22000, minGpa: 3.3, minSat: 1300 },
            { name: "State University", tier: "Public", tuition: 12000, minGpa: 2.5, minSat: 1000 }
        ];

        const COMPANIES = {
            "Tech": ["Apple", "Google", "Microsoft", "Nvidia", "Meta"],
            "Finance": ["Goldman Sachs", "JPMorgan", "Morgan Stanley", "BlackRock"],
            "Consulting": ["McKinsey & Co", "Bain", "BCG"],
            "Law": ["Kirkland & Ellis", "Latham & Watkins"],
            "Healthcare": ["Mayo Clinic", "Johns Hopkins Medicine"]
        };

        const CAREER_LADDERS = {
            "Software Engineer": ["Junior Developer", "Senior Engineer", "Staff Engineer", "Engineering Manager", "VP of Engineering", "CTO"],
            "Finance Analyst": ["Financial Analyst", "Associate", "Vice President", "Managing Director", "Partner"],
            "Management Consultant": ["Business Analyst", "Consultant", "Project Leader", "Principal", "Partner"],
            "Corporate Attorney": ["Junior Associate", "Senior Associate", "Counsel", "Partner"],
            "Physician": ["Resident Physician", "Attending Physician", "Specialist", "Department Chief"]
        };

        const BASE_SALARIES = {
            "Software Engineer": 95000,
            "Finance Analyst": 110000,
            "Management Consultant": 100000,
            "Corporate Attorney": 160000,
            "Physician": 210000,
            "Retail Worker": 32000
        };

        // ==========================================
        // GAME STATE MANAGEMENT
        // ==========================================
        let state = {
            activeTab: 'dashboard',
            character: null,
            stats: { health: 90, happiness: 85, stress: 20, reputation: 50 },
            education: { gpa: 3.5, sat: 1250, degree: 'High School Diploma', major: 'None', school: 'Public High School' },
            career: { title: 'Unemployed', company: 'None', salary: 0, level: 0, ladder: null, yearsAtCompany: 0, performance: 70 },
            finances: { cash: 0, netWorth: 0, savingsRate: 0.2, annualExpenses: 25000 },
            investments: { stocks: 0, bonds: 0, crypto: 0 },
            realEstate: [], // { name, value, mortgage }
            relationships: [], // { name, relation, trust, closeness }
            startup: null, // { name, industry, valuation, revenue }
            logs: [],
            marketCycle: 'Bull Market' // Bull, Bear, Recession
        };

        // ==========================================
        // INITIALIZATION & CHARACTER CREATION
        // ==========================================
        window.onload = function() {
            if (localStorage.getItem('american_dream_save')) {
                loadGame();
            } else {
                showCharacterCreation();
            }
        };

        function showCharacterCreation() {
            const html = `
                <div style="max-width:600px; margin:40px auto;" class="card">
                    <h2 style="font-size:1.8rem; margin-bottom:16px; text-align:center;">CREATE YOUR CHARACTER</h2>
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" id="create-firstname" class="form-input" value="Alex">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="create-lastname" class="form-input" value="Morgan">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Starting Location</label>
                        <select id="create-city" class="form-select">
                            ${Object.keys(CITIES).map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Family Background</label>
                        <select id="create-background" class="form-select">
                            <option value="Working Class">Working Class (Household Income: $45k)</option>
                            <option value="Middle Class" selected>Middle Class (Household Income: $90k)</option>
                            <option value="Upper-Middle Class">Upper-Middle Class (Household Income: $180k)</option>
                            <option value="Wealthy">Wealthy (Household Income: $400k)</option>
                            <option value="Ultra-Wealthy">Ultra-Wealthy (Household Income: $2M+)</option>
                        </select>
                    </div>
                    <button class="btn-age" style="width:100%; margin-top:16px;" onclick="finishCharacterCreation()">BEGIN LIFE</button>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function finishCharacterCreation() {
            const fn = document.getElementById('create-firstname').value || 'Alex';
            const ln = document.getElementById('create-lastname').value || 'Morgan';
            const city = document.getElementById('create-city').value;
            const bg = document.getElementById('create-background').value;

            let startingCash = 0;
            if (bg === "Working Class") startingCash = 1000;
            if (bg === "Middle Class") startingCash = 5000;
            if (bg === "Upper-Middle Class") startingCash = 25000;
            if (bg === "Wealthy") startingCash = 100000;
            if (bg === "Ultra-Wealthy") startingCash = 500000;

            state.character = {
                firstName: fn,
                lastName: ln,
                age: 18,
                city: city,
                background: bg
            };

            state.finances.cash = startingCash;
            state.finances.netWorth = startingCash;

            // Generate initial family
            state.relationships.push({ name: `${ln} Family`, relation: 'Parents', trust: 80, closeness: 85 });

            addLog(`Born in ${city} to a ${bg} family. Turned 18 and ready to enter the world.`);
            updateUI();
            renderDashboard();
        }

        // ==========================================
        // UI RENDERERS & ROUTING
        // ==========================================
        function updateUI() {
            if (!state.character) return;
            document.getElementById('top-name').innerText = `${state.character.firstName} ${state.character.lastName}`;
            document.getElementById('top-age').innerText = state.character.age;
            document.getElementById('top-location').innerText = state.character.city;
            document.getElementById('top-occupation').innerText = state.career.title;
            document.getElementById('top-cash').innerText = formatMoney(state.finances.cash);
            document.getElementById('top-networth').innerText = formatMoney(calculateNetWorth());

            renderTimelineLogs();
        }

        function switchTab(tab) {
            state.activeTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'dashboard') renderDashboard();
            if (tab === 'education') renderEducation();
            if (tab === 'career') renderCareer();
            if (tab === 'finance') renderFinance();
            if (tab === 'realestate') renderRealEstate();
            if (tab === 'relationships') renderRelationships();
            if (tab === 'relocate') renderRelocate();
        }

        function renderDashboard() {
            const html = `
                <div class="card-grid">
                    <div class="card">
                        <div class="card-title">Health</div>
                        <div class="card-value">${state.stats.health}%</div>
                        <div class="meter"><div class="meter-fill" style="width:${state.stats.health}%"></div></div>
                    </div>
                    <div class="card">
                        <div class="card-title">Happiness</div>
                        <div class="card-value">${state.stats.happiness}%</div>
                        <div class="meter"><div class="meter-fill" style="width:${state.stats.happiness}%; background:var(--accent-gold);"></div></div>
                    </div>
                    <div class="card">
                        <div class="card-title">Stress</div>
                        <div class="card-value">${state.stats.stress}%</div>
                        <div class="meter"><div class="meter-fill" style="width:${state.stats.stress}%; background:var(--accent-red);"></div></div>
                    </div>
                    <div class="card">
                        <div class="card-title">Professional Reputation</div>
                        <div class="card-value">${state.stats.reputation}/100</div>
                        <div class="meter"><div class="meter-fill" style="width:${state.stats.reputation}%; background:var(--accent-blue);"></div></div>
                    </div>
                </div>

                <div class="card" style="margin-bottom:24px;">
                    <div class="card-title">Current Status Overview</div>
                    <table class="data-table">
                        <tr><td><strong>Education</strong></td><td>${state.education.degree} (${state.education.school})</td></tr>
                        <tr><td><strong>Occupation</strong></td><td>${state.career.title} at ${state.career.company}</td></tr>
                        <tr><td><strong>Annual Salary</strong></td><td class="text-green">${formatMoney(state.career.salary)}</td></tr>
                        <tr><td><strong>Living Costs</strong></td><td class="text-red">${formatMoney(calculateAnnualExpenses())} / year</td></tr>
                        <tr><td><strong>Economic Climate</strong></td><td>${state.marketCycle}</td></tr>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderEducation() {
            let html = `
                <div class="card" style="margin-bottom:24px;">
                    <div class="card-title">Educational Profile</div>
                    <p><strong>Highest Degree:</strong> ${state.education.degree}</p>
                    <p><strong>Institution:</strong> ${state.education.school}</p>
                    <p><strong>High School GPA:</strong> ${state.education.gpa} | <strong>SAT Score:</strong> ${state.education.sat}</p>
                </div>
                <div class="card">
                    <div class="card-title">Apply to College / Graduate School</div>
                    <table class="data-table">
                        <thead>
                            <tr><th>University</th><th>Tier</th><th>Annual Tuition</th><th>Min GPA Required</th><th>Action</th></tr>
                        </thead>
                        <tbody>
                            ${UNIVERSITIES.map(u => `
                                <tr>
                                    <td><strong>${u.name}</strong></td>
                                    <td>${u.tier}</td>
                                    <td>${formatMoney(u.tuition)}</td>
                                    <td>${u.minGpa}</td>
                                    <td><button class="btn-secondary" onclick="applyToUniversity('${u.name}')">Apply</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderCareer() {
            let html = `
                <div class="card-grid">
                    <div class="card">
                        <div class="card-title">Current Position</div>
                        <div class="card-value">${state.career.title}</div>
                        <div class="card-desc">${state.career.company}</div>
                    </div>
                    <div class="card">
                        <div class="card-title">Annual Compensation</div>
                        <div class="card-value text-green">${formatMoney(state.career.salary)}</div>
                        <div class="card-desc">Base salary + bonuses</div>
                    </div>
                </div>

                <div class="card" style="margin-bottom:24px;">
                    <div class="card-title">Career Actions</div>
                    <div style="display:flex; gap:12px; margin-top:12px;">
                        <button class="btn-secondary" onclick="workHard()">Work Overtime (+Performance, +Stress)</button>
                        <button class="btn-secondary" onclick="requestPromotion()">Request Promotion / Raise</button>
                        <button class="btn-secondary" onclick="quitJob()">Quit Job</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Job Openings</div>
                    <table class="data-table">
                        <thead>
                            <tr><th>Track</th><th>Company</th><th>Entry Salary</th><th>Action</th></tr>
                        </thead>
                        <tbody>
                            ${Object.keys(CAREER_LADDERS).map(ladder => {
                                const companyList = COMPANIES[getIndustryForLadder(ladder)] || ["Corporate Corp"];
                                const comp = companyList[Math.floor(Math.random() * companyList.length)];
                                const salary = BASE_SALARIES[ladder];
                                return `
                                    <tr>
                                        <td><strong>${ladder}</strong></td>
                                        <td>${comp}</td>
                                        <td class="text-green">${formatMoney(salary)}</td>
                                        <td><button class="btn-secondary" onclick="applyForJob('${ladder}', '${comp}', ${salary})">Apply</button></td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderFinance() {
            const html = `
                <div class="card-grid">
                    <div class="card">
                        <div class="card-title">Stock Portfolio</div>
                        <div class="card-value text-green">${formatMoney(state.investments.stocks)}</div>
                        <button class="btn-secondary" style="margin-top:10px;" onclick="investMoney('stocks')">Invest Cash</button>
                    </div>
                    <div class="card">
                        <div class="card-title">Bonds / Treasury</div>
                        <div class="card-value">${formatMoney(state.investments.bonds)}</div>
                        <button class="btn-secondary" style="margin-top:10px;" onclick="investMoney('bonds')">Invest Cash</button>
                    </div>
                    <div class="card">
                        <div class="card-title">Crypto Assets</div>
                        <div class="card-value text-gold">${formatMoney(state.investments.crypto)}</div>
                        <button class="btn-secondary" style="margin-top:10px;" onclick="investMoney('crypto')">Invest Cash</button>
                    </div>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderRealEstate() {
            let html = `
                <div class="card" style="margin-bottom:24px;">
                    <div class="card-title">Owned Properties</div>
                    ${state.realEstate.length === 0 ? '<p style="font-size:0.9rem; color:var(--text-muted);">You do not own any real estate properties.</p>' : ''}
                    <table class="data-table">
                        <thead><tr><th>Property</th><th>Est. Value</th><th>Mortgage Remaining</th></tr></thead>
                        <tbody>
                            ${state.realEstate.map(p => `
                                <tr><td><strong>${p.name}</strong></td><td class="text-green">${formatMoney(p.value)}</td><td class="text-red">${formatMoney(p.mortgage)}</td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="card">
                    <div class="card-title">Real Estate Market (${state.character.city})</div>
                    <table class="data-table">
                        <thead><tr><th>Property Type</th><th>Price</th><th>Down Payment (20%)</th><th>Action</th></tr></thead>
                        <tbody>
                            <tr><td>Suburban House</td><td>$450,000</td><td>$90,000</td><td><button class="btn-secondary" onclick="buyProperty('Suburban House', 450000)">Buy</button></td></tr>
                            <tr><td>Luxury City Condo</td><td>$850,000</td><td>$170,000</td><td><button class="btn-secondary" onclick="buyProperty('Luxury City Condo', 850000)">Buy</button></td></tr>
                            <tr><td>Prime Penthouse</td><td>$2,500,000</td><td>$500,000</td><td><button class="btn-secondary" onclick="buyProperty('Prime Penthouse', 2500000)">Buy</button></td></tr>
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderRelationships() {
            let html = `
                <div class="card">
                    <div class="card-title">Relationships Network</div>
                    <table class="data-table">
                        <thead><tr><th>Name</th><th>Relation</th><th>Closeness</th><th>Action</th></tr></thead>
                        <tbody>
                            ${state.relationships.map((r, i) => `
                                <tr>
                                    <td><strong>${r.name}</strong></td>
                                    <td>${r.relation}</td>
                                    <td>${r.closeness}%</td>
                                    <td><button class="btn-secondary" onclick="spendQualityTime(${i})">Spend Time</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        function renderRelocate() {
            let html = `
                <div class="card">
                    <div class="card-title">Relocate to Another US City</div>
                    <table class="data-table">
                        <thead><tr><th>City</th><th>Cost of Living Index</th><th>Tax Rate</th><th>Action</th></tr></thead>
                        <tbody>
                            ${Object.keys(CITIES).map(c => `
                                <tr>
                                    <td><strong>${c}</strong></td>
                                    <td>${CITIES[c].col}x</td>
                                    <td>${(CITIES[c].tax * 100).toFixed(0)}%</td>
                                    <td><button class="btn-secondary" onclick="relocateCity('${c}')">Relocate ($5,000)</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        }

        // ==========================================
        // GAME ENGINE: TURN LOOP & LOGIC
        // ==========================================
        function advanceYear() {
            if (!state.character) return;
            state.character.age += 1;

            // Income calculations
            let grossIncome = state.career.salary;
            
            // Tax calculations
            const cityData = CITIES[state.character.city] || { tax: 0.05, col: 1.0 };
            const effectiveTaxRate = 0.18 + cityData.tax;
            let netIncome = grossIncome * (1 - effectiveTaxRate);

            // Expenses calculation
            let annualExpenses = calculateAnnualExpenses();

            // Investment Returns
            calculateInvestmentReturns();

            // Real Estate mortgage payment & appreciation
            state.realEstate.forEach(p => {
                p.value *= 1.03; // 3% annual appreciation
                if (p.mortgage > 0) {
                    let pay = Math.min(p.mortgage, 20000);
                    p.mortgage -= pay;
                    annualExpenses += pay;
                }
            });

            // Cash flow
            let netCashflow = netIncome - annualExpenses;
            state.finances.cash += netCashflow;

            // Random Events Engine
            triggerRandomEvents();

            addLog(`Age ${state.character.age}: Earned ${formatMoney(grossIncome)}, expenses were ${formatMoney(annualExpenses)}.`);

            // Health decay with age
            if (state.character.age > 50) {
                state.stats.health -= Math.floor(Math.random() * 3);
            }

            // Check endgame
            if (state.stats.health <= 0 || state.character.age >= 90) {
                triggerDeathScreen();
                return;
            }

            updateUI();
            switchTab(state.activeTab);
        }

        function calculateAnnualExpenses() {
            const col = CITIES[state.character.city]?.col || 1.0;
            let baseLivingCost = 25000 * col;
            return baseLivingCost;
        }

        function calculateNetWorth() {
            let total = state.finances.cash + state.investments.stocks + state.investments.bonds + state.investments.crypto;
            state.realEstate.forEach(p => {
                total += (p.value - p.mortgage);
            });
            return total;
        }

        function calculateInvestmentReturns() {
            // Market cycles
            const r = Math.random();
            if (r < 0.2) state.marketCycle = 'Bear Market';
            else if (r < 0.8) state.marketCycle = 'Bull Market';
            else state.marketCycle = 'Recession';

            let stockReturn = state.marketCycle === 'Bull Market' ? 0.10 : (state.marketCycle === 'Bear Market' ? -0.05 : -0.15);
            state.investments.stocks *= (1 + stockReturn);
            state.investments.bonds *= 1.04;
            state.investments.crypto *= (1 + (Math.random() * 0.4 - 0.18));
        }

        // ==========================================
        // CAREER & EDUCATION ACTIONS
        // ==========================================
        function applyToUniversity(schoolName) {
            const univ = UNIVERSITIES.find(u => u.name === schoolName);
            if (state.finances.cash < univ.tuition && state.character.background === 'Working Class') {
                showModal("Admission Deferred", `You were accepted to ${schoolName}, but cannot afford the tuition without taking debt.`, [
                    { text: "Take Student Loans", action: () => { state.finances.cash -= univ.tuition; state.education.degree = "Bachelor's Degree"; state.education.school = schoolName; addLog(`Enrolled at ${schoolName}.`); closeModal(); updateUI(); renderEducation(); } },
                    { text: "Decline Offer", action: closeModal }
                ]);
            } else {
                state.education.degree = "Bachelor's Degree";
                state.education.school = schoolName;
                state.finances.cash -= univ.tuition;
                addLog(`Accepted and enrolled at ${schoolName}!`);
                updateUI();
                renderEducation();
            }
        }

        function applyForJob(ladder, company, baseSalary) {
            state.career.title = CAREER_LADDERS[ladder][0];
            state.career.company = company;
            state.career.salary = baseSalary;
            state.career.ladder = ladder;
            state.career.level = 0;
            addLog(`Hired as ${state.career.title} at ${company}!`);
            updateUI();
            renderCareer();
        }

        function workHard() {
            state.career.performance = Math.min(100, state.career.performance + 15);
            state.stats.stress = Math.min(100, state.stats.stress + 10);
            addLog("Put in extra hours at work.");
            updateUI();
            renderCareer();
        }

        function requestPromotion() {
            if (state.career.performance >= 80 && state.career.ladder) {
                const nextLevel = state.career.level + 1;
                const ladderTitles = CAREER_LADDERS[state.career.ladder];
                if (nextLevel < ladderTitles.length) {
                    state.career.level = nextLevel;
                    state.career.title = ladderTitles[nextLevel];
                    state.career.salary = Math.floor(state.career.salary * 1.3);
                    state.career.performance = 60;
                    addLog(`Promoted to ${state.career.title}! Salary increased to ${formatMoney(state.career.salary)}.`);
                    showModal("PROMOTION GRANTED!", `Your hard work paid off. You are now ${state.career.title}.`, [{ text: "Awesome!", action: closeModal }]);
                } else {
                    showModal("Max Level Reached", "You are already at the top of this career track.", [{ text: "OK", action: closeModal }]);
                }
            } else {
                showModal("Promotion Denied", "Your performance review wasn't high enough for a promotion this year.", [{ text: "I'll work harder", action: closeModal }]);
            }
            updateUI();
            renderCareer();
        }

        function quitJob() {
            state.career.title = "Unemployed";
            state.career.company = "None";
            state.career.salary = 0;
            addLog("Resigned from job.");
            updateUI();
            renderCareer();
        }

        // ==========================================
        // INVESTMENT & PROPERTY ACTIONS
        // ==========================================
        function investMoney(type) {
            const amount = 10000;
            if (state.finances.cash >= amount) {
                state.finances.cash -= amount;
                state.investments[type] += amount;
                addLog(`Invested ${formatMoney(amount)} into ${type}.`);
                updateUI();
                renderFinance();
            } else {
                showModal("Insufficient Cash", "You need at least $10,000 cash to place an investment.", [{ text: "OK", action: closeModal }]);
            }
        }

        function buyProperty(name, price) {
            const downPayment = price * 0.20;
            if (state.finances.cash >= downPayment) {
                state.finances.cash -= downPayment;
                state.realEstate.push({ name: name, value: price, mortgage: price - downPayment });
                addLog(`Purchased ${name} for ${formatMoney(price)} with ${formatMoney(downPayment)} down.`);
                updateUI();
                renderRealEstate();
            } else {
                showModal("Insufficient Down Payment", `You need at least ${formatMoney(downPayment)} cash for the 20% down payment.`, [{ text: "OK", action: closeModal }]);
            }
        }

        function spendQualityTime(index) {
            const rel = state.relationships[index];
            rel.closeness = Math.min(100, rel.closeness + 10);
            state.stats.happiness = Math.min(100, state.stats.happiness + 5);
            addLog(`Spent quality time with ${rel.name}.`);
            updateUI();
            renderRelationships();
        }

        function relocateCity(city) {
            if (state.finances.cash >= 5000) {
                state.finances.cash -= 5000;
                state.character.city = city;
                addLog(`Relocated to ${city}.`);
                updateUI();
                renderRelocate();
            }
        }

        // ==========================================
        // RANDOM EVENTS & MODALS
        // ==========================================
        function triggerRandomEvents() {
            const roll = Math.random();
            if (roll < 0.15) {
                showModal("Market Opportunity", "A close contact approaches you with an early-stage startup investment opportunity.", [
                    { text: "Invest $10,000", action: () => { 
                        if(state.finances.cash>=10000) { 
                            state.finances.cash-=10000; 
                            if(Math.random()>0.5){ state.finances.cash+=50000; addLog("Startup investment paid off 5x!"); } 
                            else { addLog("Startup went bankrupt."); }
                        } closeModal(); updateUI();
                    }},
                    { text: "Pass", action: closeModal }
                ]);
            } else if (roll < 0.25) {
                showModal("Health Event", "You've been feeling burnt out from high stress levels.", [
                    { text: "Take a vacation (-$3,000, +Health)", action: () => { state.finances.cash-=3000; state.stats.health=Math.min(100, state.stats.health+15); closeModal(); updateUI(); } },
                    { text: "Power through", action: () => { state.stats.health-=10; closeModal(); updateUI(); } }
                ]);
            }
        }

        function triggerDeathScreen() {
            showModal("THE JOURNEY ENDS", `You passed away at age ${state.character.age}. Final Lifetime Net Worth: ${formatMoney(calculateNetWorth())}.`, [
                { text: "Start New Life", action: () => { closeModal(); showCharacterCreation(); } }
            ]);
        }

        function showModal(title, body, options) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            const container = document.getElementById('modal-actions');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = opt.action;
                container.appendChild(btn);
            });
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }

        // ==========================================
        // LOGGING & UTILITIES
        // ==========================================
        function addLog(msg) {
            state.logs.unshift({ age: state.character?.age || 18, text: msg });
        }

        function renderTimelineLogs() {
            const container = document.getElementById('timeline-logs');
            container.innerHTML = state.logs.map(l => `
                <div class="log-entry">
                    <div class="log-age">Age ${l.age}</div>
                    <div>${l.text}</div>
                </div>
            `).join('');
        }

        function formatMoney(num) {
            return '$' + Math.floor(num).toLocaleString();
        }

        function getIndustryForLadder(ladder) {
            if (ladder === 'Software Engineer') return 'Tech';
            if (ladder === 'Finance Analyst') return 'Finance';
            if (ladder === 'Management Consultant') return 'Consulting';
            if (ladder === 'Corporate Attorney') return 'Law';
            if (ladder === 'Physician') return 'Healthcare';
            return 'Tech';
        }

        // ==========================================
        // PERSISTENCE (SAVE / LOAD)
        // ==========================================
        function saveGame() {
            localStorage.setItem('american_dream_save', JSON.stringify(state));
            alert("Game Saved Successfully!");
        }

        function loadGame() {
            const saved = localStorage.getItem('american_dream_save');
            if (saved) {
                state = JSON.parse(saved);
                updateUI();
                renderDashboard();
            }
        }

        function resetGamePrompt() {
            if (confirm("Are you sure you want to restart and start a new life?")) {
                localStorage.removeItem('american_dream_save');
                location.reload();
            }
        }
    </script>
</body>
</html>
